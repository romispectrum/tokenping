name: Bug report
description: Something in Tokenping does not work as described
title: 'bug: <title>'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Never paste private keys, seed phrases, API keys or the contents of an .env file here.

  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Search the issues first, in case it is already reported.
      options:
        - label: I have looked through the [existing issues](https://github.com/romispectrum/tokenping/issues)
          required: true

  - type: dropdown
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - tokenping.xyz
        - A local development setup
    validations:
      required: true

  - type: textarea
    attributes:
      label: Current behavior
      description: What happens.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The steps, the network and market, and the alert channel if it is about an alert.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: Browser and wallet, screenshots, or the error text. You can drag images or log files into this field.
    validations:
      required: false
