# fly.toml app configuration file generated for tokenping-signal on 2026-04-21T11:07:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tokenping-signal'
primary_region = 'iad'

[build]

# SIGNAL_API_TOKEN is a secret (`fly secrets set SIGNAL_API_TOKEN=...`), never an [env] value. Without it the
# machine refuses to start. See docs/signal-server-fly.md.
[env]
  MODE = 'normal'

[[mounts]]
  source = 'signal_data'
  destination = '/home/.local/share/signal-cli'
  initial_size = '1gb'

# 8080 is Caddy, which checks the token. signal-cli-rest-api itself listens on 8081, which Fly does not route.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    # The one route Caddy serves without the token.
    path = '/v1/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
