# fly.toml app configuration file generated for tokenping-signal on 2026-04-21T11:07:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tokenping-signal'
primary_region = 'iad'

[build]

[env]
  MODE = 'normal'

[[mounts]]
  source = 'signal_data'
  destination = '/home/.local/share/signal-cli'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/v1/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
